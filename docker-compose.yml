services:
  engine:
    build: ./engine
    volumes:
      - ./backup:/data             # base de conhecimento persistente (backup/kb.journal)
    # porta exposta só para depuração (curl localhost:8080/base); podes remover
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "swipl", "-g", "use_module(library(http/http_open)),http_open('http://localhost:8080/health',S,[]),close(S)", "-t", "halt"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  web:
    build: ./web
    environment:
      ENGINE_URL: http://engine:8080
    volumes:
      - ./backup/espectros:/data/espectros   # CSVs originais, para reabrir análises
    ports:
      - "3000:3000"
    depends_on:
      engine:
        condition: service_healthy
    restart: unless-stopped
